C%96%E6%80%BB%E8%A7%88/docs/08_%E7%89%A9%E7%90%86%E6%A8%A1%E5%9E%8B%E7%BB%BC%E8%BF%B0/03_%E5%88%9A%E4%BD%93%E4%B8%8E%E5%A4%9A%E4%BD%93%E5%8A%A8%E5%8A%9B%E5%AD%A6.html"}, {"d": "刚体与多体动力学", "n": "恢复系数碰撞与事件驱动分段仿真", "y": "2011B、2012B、2015B", "scene": "球类与边界（地板/篮板/篮筐/树）的反复碰撞。", "eq": "法向恢复系数 $e$（2015B 用 Penner 的 $e(v_\\perp)$，随撞速变化），切向摩擦反弹 $v'_\\parallel=\\tfrac57v_\\parallel-\\tfrac27R\\omega_r$（Daish），弹跳总长为公比 $e$ 的几何级数，滚动 $L_r=v'^2_\\parallel/2\\mu g$。", "pt": "", "err": "恢复系数取常数（实际随撞速变化）；backspin 过大时 $v'_\\parallel<0$ 球会回滚的情形漏掉；\"落地即停\"忽略弹跳与滚动，落点判据失真。", "u": "../09_%E5%8F%AF%E8%A7%86%E5%8C%96%E6%80%BB%E8%A7%88/docs/08_%E7%89%A9%E7%90%86%E6%A8%A1%E5%9E%8B%E7%BB%BC%E8%BF%B0/03_%E5%88%9A%E4%BD%93%E4%B8%8E%E5%A4%9A%E4%BD%93%E5%8A%A8%E5%8A%9B%E5%AD%A6.html"}, {"d": "刚体与多体动力学", "n": "约束轨道与过载设计", "y": "2019B 过山车", "scene": "", "eq": "190 队（Nuova-Prime）写五段轨道（斜坡/三连半圆/上爬坡/双螺旋/下坡+圆弧）的牛顿运动 ODE + 平方空气阻力 + 分段摩擦系数，递归欧拉法（$\\Delta t=10^{-4}$ s）+ 能量总账 $Mgh$ 校验；389 队用 9 分段动能定理递推（半解析），clothoid 环 + 大半径回转做轨道选型，风阻 $F_w=\\tfrac12\\rho A_DC_Dv^2$。", "pt": "", "err": "", "u": "../09_%E5%8F%AF%E8%A7%86%E5%8C%96%E6%80%BB%E8%A7%88/docs/08_%E7%89%A9%E7%90%86%E6%A8%A1%E5%9E%8B%E7%BB%BC%E8%BF%B0/03_%E5%88%9A%E4%BD%93%E4%B8%8E%E5%A4%9A%E4%BD%93%E5%8A%A8%E5%8A%9B%E5%AD%A6.html"}, {"d": "刚体与多体动力学", "n": "非线性弹性与人-结构耦合", "y": "2023B 蹦床", "scene": "", "eq": "", "pt": "共同起点：弹簧几何伸长 → 竖直投影 $F_v(x)$。三条技术路线：102 队走\"线性化 + 修正\"——先画 $F_v(x)$ 曲线标定线性区（$x<0.5$ m、$k=8000$ N/m），修正阶段回到二次律 $F_v\\approx\\frac{NsK_s}{2R}x^2$，用对比图证明简化误差可忽略（最稳健）；138 队工程化最深——单簧刚度 $k=Gd^4/(8nD^3)\\approx712…", "err": "", "u": "../09_%E5%8F%AF%E8%A7%86%E5%8C%96%E6%80%BB%E8%A7%88/docs/08_%E7%89%A9%E7%90%86%E6%A8%A1%E5%9E%8B%E7%BB%BC%E8%BF%B0/03_%E5%88%9A%E4%BD%93%E4%B8%8E%E5%A4%9A%E4%BD%93%E5%8A%A8%E5%8A%9B%E5%AD%A6.html"}, {"d": "刚体与多体动力学", "n": "姿态与旋转稳定性", "y": "2023A 部分，可迁移到 2020B 四旋翼", "scene": "自由下落体的姿态失稳。", "eq": "", "pt": "", "err": "", "u": "../09_%E5%8F%AF%E8%A7%86%E5%8C%96%E6%80%BB%E8%A7%88/docs/08_%E7%89%A9%E7%90%86%E6%A8%A1%E5%9E%8B%E7%BB%BC%E8%BF%B0/03_%E5%88%9A%E4%BD%93%E4%B8%8E%E5%A4%9A%E4%BD%93%E5%8A%A8%E5%8A%9B%E5%AD%A6.html"}, {"d": "热学与能量输运", "n": "集总热平衡与 Arrhenius 动力学", "y": "2018B 堆肥", "scene": "\"整体作为一个热源 + 热容 + 散热口\"的系统（堆肥、仓贮、生物反应器）。", "eq": "", "pt": "", "err": "效率指标不可积分或全文不一致；只算热不算氧；文献动力学参数静默照搬（240 发现文献 $k(T)$ 峰位在 80–100 °C 与题给 40–60 °C 矛盾后明说并重标定，是\"用文献\"与\"被文献用\"的分水岭）；为 5–20 °C 日变写复杂边界却不给趋肤深度论证（$\\sqrt{\\alpha\\tau_{day}/\\pi}\\approx0.12$ m，核心只\"看见\"均值 12.5 °C）。", "u": "../09_%E5%8F%AF%E8%A7%86%E5%8C%96%E6%80%BB%E8%A7%88/docs/08_%E7%89%A9%E7%90%86%E6%A8%A1%E5%9E%8B%E7%BB%BC%E8%BF%B0/04_%E7%83%AD%E5%AD%A6%E4%B8%8E%E8%83%BD%E9%87%8F%E8%BE%93%E8%BF%90.html"}, {"d": "热学与能量输运", "n": "行星热演化：衰变热 + Fourier 导热", "y": "2012A 火山", "scene": "行星/天体内部热历史。", "eq": "$CM\\frac{dT}{dt}=P_0e^{-t/\\tau}-B(T-T_0)$，$B=\\frac{4\\pi R^2k}{d}$；标度律 $R\\propto\\xi^{1/3}$、$d\\propto R$、$P_0\\propto\\xi$、$CM\\propto\\xi$（相消），得冷却速率 $B/(CM)\\propto\\xi^{-2/3}$，", "pt": "", "err": "漏掉 $M$ 同时出现在供热与热容两端（会得出\"寿命与质量无关\"）；用地表实测热流直接乘面积（隐含壳厚不随质量变）；不做端点校验就外推；把表面喷发温度与幔固相线混用（差出的寿命达十亿年量级，必须声明取哪个阈值）。", "u": "../09_%E5%8F%AF%E8%A7%86%E5%8C%96%E6%80%BB%E8%A7%88/docs/08_%E7%89%A9%E7%90%86%E6%A8%A1%E5%9E%8B%E7%BB%BC%E8%BF%B0/04_%E7%83%AD%E5%AD%A6%E4%B8%8E%E8%83%BD%E9%87%8F%E8%BE%93%E8%BF%90.html"}, {"d": "热学与能量输运", "n": "辐射平衡与温室模型", "y": "2015A、2021A", "scene": "", "eq": "零维 $T_s=\\left[\\frac{S(1-\\alpha)}{4\\sigma}\\right]^{1/4}$；单层温室/半灰模型（光学深度 $\\tau$–温度）用 $T_g=T_s(1+\\frac34\\tau)^{1/4}$ 一类修正。", "pt": "", "err": "", "u": "../09_%E5%8F%AF%E8%A7%86%E5%8C%96%E6%80%BB%E8%A7%88/docs/08_%E7%89%A9%E7%90%86%E6%A8%A1%E5%9E%8B%E7%BB%BC%E8%BF%B0/04_%E7%83%AD%E5%AD%A6%E4%B8%8E%E8%83%BD%E9%87%8F%E8%BE%93%E8%BF%90.html"}, {"d": "热学与能量输运", "n": "再入气动加热", "y": "2023A 部分", "scene": "", "eq": "驻点温度 $T_0=T_\\infty\\left(1+\\frac{\\gamma-1}{2}Ma^2\\right)$。从 ~60 km 起跳峰值速度 ~1 km/s 出现在 35–40 km（$Ma\\approx3$），$T_0\\sim650$–750 K ≫ 服材耐温 394–423 K——", "pt": "", "err": "", "u": "../09_%E5%8F%AF%E8%A7%86%E5%8C%96%E6%80%BB%E8%A7%88/docs/08_%E7%89%A9%E7%90%86%E6%A8%A1%E5%9E%8B%E7%BB%BC%E8%BF%B0/04_%E7%83%AD%E5%AD%A6%E4%B8%8E%E8%83%BD%E9%87%8F%E8%BE%93%E8%BF%90.html"}, {"d": "热学与能量输运", "n": "撞击能量学", "y": "2015A、2021B", "scene": "撞击、爆炸、成坑、成波——一切\"能量从哪来到哪去\"的记账题。", "eq": "$E=\\tfrac12mv^2$（2021B：$10^{10}$ kg @ 20 km/s = $2\\times10^{18}$ J ≈ 480 Mt TNT）→ 分配比例（成腔/成波/成坑/热）→ 效应端经验律。", "pt": "", "err": "", "u": "../09_%E5%8F%AF%E8%A7%86%E5%8C%96%E6%80%BB%E8%A7%88/docs/08_%E7%89%A9%E7%90%86%E6%A8%A1%E5%9E%8B%E7%BB%BC%E8%BF%B0/04_%E7%83%AD%E5%AD%A6%E4%B8%8E%E8%83%BD%E9%87%8F%E8%BE%93%E8%BF%90.html"}, {"d": "生物物理与标度律", "n": "异速生长律（allometric scaling）家族 $Y\\propto M^a$", "y": "", "scene": "任何\"身体某个量随体重怎么变\"的问题——代谢率、血容量、骨骼占比、步频、寿命。它是把生物学变成物理学的第一把钥匙，因为幂律两端取对数后就是一条直线，可回归、可检验、可外推。", "eq": "$$Y = a M^b \\quad\\Longleftrightarrow\\quad \\log Y = \\log a + b\\log M,$$ 能耗上限形式（McNab 框架）：日能耗 $\\mathrm{FEE}=aM^b$（$b<1$），环境对单个个体每日能供给上限记 $K$，联立得 $$M_{max}=\\Big(\\frac{K}{a}\\Big)^{1/b}.$$", "pt": "① 指数 $b$ 群间相近（哺乳 ~0.73、爬行 ~0.89、巨蜥 ~0.71，文献区间 0.67–0.85），群间差异几乎全部由质量无关系数 $a$ 承载——$a$ 越小，同等环境养得起的体重越大；② 必须亲自回归并报告 $n$、$r^2$、$p$ 三件套；③ 回归口径要统一（BMR 与 FMR 相差 2–3 倍，不可混用；单位进对数前要一致）。", "err": "只讲\"恐龙代谢低所以能更大\"的故事而不产出与 10 倍对标的具体数字；把 $Fr$ 式幂律当万能公式不做外推合法性论证（441 队预测的 100 t 超出数据集两个量级，必须单独论证幂律外推的合理性并做独立热学检查）。", "u": "../09_%E5%8F%AF%E8%A7%86%E5%8C%96%E6%80%BB%E8%A7%88/docs/08_%E7%89%A9%E7%90%86%E6%A8%A1%E5%9E%8B%E7%BB%BC%E8%BF%B0/05_%E7%94%9F%E7%89%A9%E7%89%A9%E7%90%86%E4%B8%8E%E6%A0%87%E5%BA%A6%E5%BE%8B.html"}, {"d": "生物物理与标度律", "n": "平方-立方律与结构强度标度", "y": "骨骼/肌肉/树木", "scene": "体型放大或环境重力改变时，\"重量按 $l^3$ 长而支撑截面按 $l^2$ 长\"的矛盾如何被演化化解。", "eq": "几何相似下骨应力 $\\sigma \\sim mg/A \\propto M^{1/3}$；等应力设计（地球动物跨物种骨强度近似恒定）要求 $$\\frac{mg}{A}=\\sigma_{\\rm bone}=\\text{const}\\quad\\Rightarrow\\quad A\\propto g\\,M^{2/3},$$ 而加粗骨骼的代价是骨骼自重占比 $f_{\\rm bone}\\propto g\\,l$——体型上限由\"骨骼占重比不失控\"决定。", "pt": "① 工况要用动载荷（奔跑时地面反力为体重 2–3 倍、四足分担），站立工况会低估；② 平方-立方律只是\"下界约束\"，演化可以加粗骨骼（正异速生长）对抗它，真正上限来自自重占比；③ 安全因子是现成的锚点——大象下肢骨安全因子已仅 2–3。", "err": "把平方-立方律当全部答案，直接说\"2g 下生物缩小一半\"——既忽略骨骼可加粗，也没指出真正上限在自重占比；引用骨强度等生物常数零出处（超重力题最容易被批\"编故事\"）。", "u": "../09_%E5%8F%AF%E8%A7%86%E5%8C%96%E6%80%BB%E8%A7%88/docs/08_%E7%89%A9%E7%90%86%E6%A8%A1%E5%9E%8B%E7%BB%BC%E8%BF%B0/05_%E7%94%9F%E7%89%A9%E7%89%A9%E7%90%86%E4%B8%8E%E6%A0%87%E5%BA%A6%E5%BE%8B.html"}, {"d": "生物物理与标度律", "n": "心血管与流体标度", "y": "", "scene": "重力改变时循环系统的代价（2013-B 的第二主线）。", "eq": "把血液泵到高度 $h$ 需压差 $\\Delta P=\\rho_b g h$；心脏壁厚由 Laplace 定律 $\\Delta P=2\\sigma t/r$ 联系；血容量按 Dawson 异速律 $V\\propto g$（注意该律在高 $g$ 发散，仅限小幅变化，须标注失效域）。", "pt": "真实生理常数自检是本模型的灵魂——长颈鹿头部高于心脏 ~2 m，$\\rho_bgh\\approx2.1\\times10^4$ Pa ≈ 155 mmHg，与长颈鹿实测血压量级吻合，这个对照一步建立\"模型没有瞎编\"的信任。2g 下同身高血压翻倍，出路只有三条：身高/附肢减半、心脏壁增厚、血容量调整。", "err": "忘了血压梯度与身高耦合，把\"心脏变大\"当成无代价方案；$V\\propto g$ 外推到极端重力不标注失效域。", "u": "../09_%E5%8F%AF%E8%A7%86%E5%8C%96%E6%80%BB%E8%A7%88/docs/08_%E7%89%A9%E7%90%86%E6%A8%A1%E5%9E%8B%E7%BB%BC%E8%BF%B0/05_%E7%94%9F%E7%89%A9%E7%89%A9%E7%90%86%E4%B8%8E%E6%A0%87%E5%BA%A6%E5%BE%8B.html"}, {"d": "生物物理与标度律", "n": "步态与运动标度", "y": "Froude 数 + 代谢功率", "scene": "\"它跑多快\"这类运动能力问题。", "eq": "肢体是倒摆，Froude 数 $$Fr=\\frac{v^2}{gl}\\quad(\\text{特征长度取腿长 } l)$$ 控制步态转换：走-跑阈值 $Fr\\approx0.3$–0.8，跑-飞奔 $Fr\\approx2$–3（Alexander 实测）。同一速度下 $g$ 加倍使 $Fr$ 减半——\"地球上在飞奔、系外行星上只是小跑\"。极速的更硬约束是代谢功率：移动每米克服重力做功 $\\sim c\\,mg$（地球 cost of transport ~10–20 J/(kg·m)），比功率恒定给出 $v_{\\max}\\propto l/g$。", "pt": "$Fr$ 只是步态转换判据，不能当极速公式；极速应诉诸功率论证。跳跃高度 $h=v^2/(2g)$ 减半（肌肉能量密度不变）是同一思想的另一面。", "err": "Froude 数特征长度取身高而非腿长；把 $Fr$ 阈值当极速判据。", "u": "../09_%E5%8F%AF%E8%A7%86%E5%8C%96%E6%80%BB%E8%A7%88/docs/08_%E7%89%A9%E7%90%86%E6%A8%A1%E5%9E%8B%E7%BB%BC%E8%BF%B0/05_%E7%94%9F%E7%89%A9%E7%89%A9%E7%90%86%E4%B8%8E%E6%A0%87%E5%BA%A6%E5%BE%8B.html"}, {"d": "生物物理与标度律", "n": "撞击生物毁伤判据", "y": "阈值工程", "scene": "题目给出\"substantial damage\"式模糊判据，要求反解物理参数（2021-B）。这本质上是把\"人/建筑能承受什么\"作为生物-工程界面的经验标度问题。", "eq": "无普适方程，核心是把判据翻译成带文献的数值阈值，再嵌入波幅-质量关系 $$A(r)=\\frac{9700\\sqrt{E_{\\rm kt}}}{r}\\ (\\text{Gault \\& Sonett 实验律})\\quad\\text{或}\\quad A(r)\\propto \\min(D_{tc}/14,H)\\cdot\\frac{3D_{tc}}{4r}\\ (\\text{CMM05}),$$ 最后反解 $m_{\\min}$。", "pt": "阈值翻倍在振幅-质量关系里放大成质量翻一个数量级，所以阈值工程直接决定答案数量级——2021-B 四支金奖队答案横跨两个多数量级（$10^9$–$1.7\\times10^{11}$ kg），第一分歧来源正是阈值：216 队引三份海啸灾害文献定 2 m 波高（毁木屋/砖房）、442 队按 ITIS-2012 量表对 D 类建筑定 7 m、385 队取 Watanabe 海啸等级 3（10–20 m）、445 队自定 10 m。", "err": "阈值随手拍一个数不给文献；不报告对阈值/波幅定律选择的敏感性（两条文献波幅律在 1000 km 处可差一个量级）。", "u": "../09_%E5%8F%AF%E8%A7%86%E5%8C%96%E6%80%BB%E8%A7%88/docs/08_%E7%89%A9%E7%90%86%E6%A8%A1%E5%9E%8B%E7%BB%BC%E8%BF%B0/05_%E7%94%9F%E7%89%A9%E7%89%A9%E7%90%86%E4%B8%8E%E6%A0%87%E5%BA%A6%E5%BE%8B.html"}, {"d": "生物物理与标度律", "n": "人体辐射剂量学", "y": "人作为被照射对象", "scene": "辐射防护题中\"人\"这一端的判据（2019-A）。", "eq": "吸收剂量 $D=E/m$（Gy）→ 品质因子加权 → 剂量当量 $H$（Sv）；基准线 $D_0=\\dot D\\,T_{\\rm cruise}$，取 MSL/RAD 实测巡航 ~1.8 mSv/天 × Hohmann 259 天 ≈ 480 mSv，对照 NASA 职业限值（~600 mSv/职业生涯）。", "pt": "① Gy 与 Sv 混用是最典型的判据口径漂移（品质因子随粒子类型在 2–20 间变化）；② \"没有基准线就没有防护\"——先算无屏蔽剂量，再算屏蔽后剂量，给\"559.48 Sv → 1.86 Sv\"式对照（105 队），评委才有可判定结论。", "err": "用\"年剂量限值\"套\"单程剂量\"；忽略品质因子随粒子类型变化；只报屏蔽厚度不给有/无屏蔽的 Sv 闭环数字。 ## 3. 跨题目的建模套路总结 1.", "u": "../09_%E5%8F%AF%E8%A7%86%E5%8C%96%E6%80%BB%E8%A7%88/docs/08_%E7%89%A9%E7%90%86%E6%A8%A1%E5%9E%8B%E7%BB%BC%E8%BF%B0/05_%E7%94%9F%E7%89%A9%E7%89%A9%E7%90%86%E4%B8%8E%E6%A0%87%E5%BA%A6%E5%BE%8B.html"}, {"d": "电磁辐射与辐射防护", "n": "洛伦兹偏转与磁屏蔽几何", "y": "", "scene": "一切\"用磁场挡/转带电粒子\"的方案评估（2017-B 导向、2019-A 主动屏蔽）。", "eq": "$$\\vec F=q\\vec v\\times\\vec B,\\qquad r_L=\\frac{mv}{qB}.$$ 关键约束：洛伦兹力不做功——磁场只能折转方向、重新分配动量分量（径向动量转轴向），不能加速；1 GeV 质子 $pc\\approx1.7$ GeV/c，$r_L\\approx5.7/B[\\mathrm{T}]$ m。", "pt": "① 偏转判据必须落到\"回旋半径 vs 作用区尺度\"的比较（2019-A 的 343 队写成 $L\\ge2r_L$；2017-B 的 609 队折转角 $\\varphi=L/r_g$，即 $r_g=mv/qB=0.068\\,\\mathrm{m}/B[\\mathrm{T}]$ 对氙离子）；② 场几何要显式构造最优解——609 队构造", "err": "把磁场当\"能加速离子\"的工具（违背不做功定理）；只画场图不验算 $r_L$ 与储能；把中和后的中性原子当作用对象；收益与代价不成对（算出 2–6% 收益却不与磁体功耗放上天平）。", "u": "../09_%E5%8F%AF%E8%A7%86%E5%8C%96%E6%80%BB%E8%A7%88/docs/08_%E7%89%A9%E7%90%86%E6%A8%A1%E5%9E%8B%E7%BB%BC%E8%BF%B0/06_%E7%94%B5%E7%A3%81%E8%BE%90%E5%B0%84%E4%B8%8E%E8%BE%90%E5%B0%84%E9%98%B2%E6%8A%A4.html"}, {"d": "电磁辐射与辐射防护", "n": "光子屏蔽：指数衰减律", "y": "", "scene": "γ/X 射线、β 粒子的被动屏蔽层设计（2019-A）。", "eq": "$$I=I_0e^{-\\mu_m\\rho x},$$ 配 NIST 质量衰减系数表反解厚度；多层屏蔽按\"低穿透先挡\"排序（105 队：Plexiglass 40 cm 挡 β 与低能带电粒子以抑制韧致辐射 → 铅 3.5 cm 挡 γ → Kevlar 6 cm）。", "pt": "γ 屏蔽公式", "err": "质量只算屏蔽膜不算支撑/密封/余量；几何随手估（$V=1000\\ \\mathrm{m^3}$ 应先算出球形 $R=6.2$ m、$A=483\\ \\mathrm{m^2}$，等容积圆柱多 15% 屏蔽质量）。", "u": "../09_%E5%8F%AF%E8%A7%86%E5%8C%96%E6%80%BB%E8%A7%88/docs/08_%E7%89%A9%E7%90%86%E6%A8%A1%E5%9E%8B%E7%BB%BC%E8%BF%B0/06_%E7%94%B5%E7%A3%81%E8%BE%90%E5%B0%84%E4%B8%8E%E8%BE%90%E5%B0%84%E9%98%B2%E6%8A%A4.html"}, {"d": "电磁辐射与辐射防护", "n": "带电重粒子屏蔽：射程、剂量-深度极小与低 Z 材料", "y": "", "scene": "GCR（GeV 级）与 SPE（百 MeV 质子）的防护（2019-A 的物理核心）。", "eq": "射程表（PSTAR/NIST）——1 GeV 质子在水中射程 ~300 g/cm²（3 m 水），\"挡住\"在质量上不可能（每 100 g/cm² 即 ~48 t），只能减剂量；200 MeV SPE 质子射程 ~27 g/cm²，30–50 g/cm² 掩体可挡。剂量-面密度曲线在 ~15–25 g/cm² 处有", "pt": "① 材料选低 Z 高 H（水、PE、食物/废料墙），氢利于弹性散射慢化中子且次级产额低；铝是结构材料不是好屏蔽；② 任务剖面分层——巡航 GCR 靠减剂量 + 全舱薄屏蔽，SPE 短暴靠小型风暴掩体（20 m³ 球、50 g/cm² 水仅 17.7 t），\"全舱轻屏蔽 + 小掩体\"的混合战术是\"附加质量\"问题的高级答案；③ 时间与路径是零质量防护：Hohmann 缩时、Van Allen 带快速穿越（105 队数值积分找 43.6°/55.3° 发射窗口）、太阳周期窗口（GCR 极小/极大差 ~2 倍）。", "err": "Gy/Sv 混用；把光子衰减系数用于带电粒子；漏掉 Van Allen 穿越与 SPE 掩体两个任务相位；方案在真实任务剖面下穿洞。", "u": "../09_%E5%8F%AF%E8%A7%86%E5%8C%96%E6%80%BB%E8%A7%88/docs/08_%E7%89%A9%E7%90%86%E6%A8%A1%E5%9E%8B%E7%BB%BC%E8%BF%B0/06_%E7%94%B5%E7%A3%81%E8%BE%90%E5%B0%84%E4%B8%8E%E8%BE%90%E5%B0%84%E9%98%B2%E6%8A%A4.html"}, {"d": "电磁辐射与辐射防护", "n": "电源系统标度：RTG / 太阳能 / 裂变堆对比", "y": "2024-B", "scene": "\"以质量最小为目标给深空/行星表面供电\"的系统设计题。", "eq": "能量账本 $E=P_et$（150 kW × 2 年 = $9.47\\times10^{12}$ J，铀裂变 $8.2\\times10^{13}$ J/kg → 燃耗仅 ~460 g，装料 10–15 kg，燃料与寿命完全不是约束）；比功率标度 $M=P/(\\mathrm{W/kg})$；辐射器面积 $A_{rad}=P_{rej}/(\\varepsilon\\sigma T_r^4)$，废热 $P_{rej}=P_e(1/\\eta-1)=450$ kW；风电功率密度 $\\frac12\\rho v^3$（火星 20 m/s 仅 80 W/m²，Betz 前——一票否决）。", "pt": "① \"continuously\"口径定义是全题题眼：夜间与全球沙尘暴期是否保证 150 kW？沙尘暴直射可跌到晴空 15–25%，保证连续需 ×4–6 过构建——681 队仅 3 队金奖（0.44%）的主因正是口径不定义；② 质量边界声明（发电/储能/热控/屏蔽/配电是否计入）；③ 裂变堆内部必须拆解 数字都是物理钩子——245/490/735/980 Hz 四阶恰落在题给 98–1047 Hz 通带内，识别并利用这个干净的谐波结构是三支金奖队的共同获奖基础（批次 10 观察：题面数字本身指向干净谐波结构）。98 Hz 下限对应叶腔 Helmholtz 模式，1047 Hz 上限对应\"波长与腔体尺寸可比、集总假设失效\"。", "err": "把 98–1047 Hz 只做成一条理想带通，丢掉 245n Hz 四个窄谐振峰——恰是题面尺寸白送的音色骨架，也是\"authentic\"与\"能出声\"的分界。", "u": "../09_%E5%8F%AF%E8%A7%86%E5%8C%96%E6%80%BB%E8%A7%88/docs/08_%E7%89%A9%E7%90%86%E6%A8%A1%E5%9E%8B%E7%BB%BC%E8%BF%B0/07_%E5%A3%B0%E5%AD%A6%E4%B8%8E%E4%BF%A1%E5%8F%B7%E5%A4%84%E7%90%86.html"}, {"d": "声学与信号处理", "n": "Helmholtz 共振与共鸣器包络", "y": "", "scene": "腔体类共鸣器的低频下限与宽带包络（叶共鸣器、扬声器箱体）。", "eq": "$$f_H=\\frac{c}{2\\pi}\\sqrt{\\frac{A}{V L_{eff}}};\\qquad \\text{宽带包络中心}\\ f_0=\\sqrt{f_L f_H}\\approx320\\ \\mathrm{Hz},\\ Q\\approx0.34\\ (\\text{低}Q=\\text{宽带共鸣}).$$", "pt": "① 手工编织叶腔无法解析精算——必须声明建模立场：物理先验参数化或测量（485 队用吉他/曼陀林类比 + Helmholtz 先验；182 队引竹材 DMTA 数据）；② 同一公式反向使用：扬声器倒相箱调谐到 ~98 Hz，等于\"电声箱体重新做一个 Helmholtz 共振接回叶腔下限\"——末级最易被漏掉的一环。", "err": "滤波器频响达标 ≠ 系统声学达标，扬声器末级必须单独验证；目标频响凭空设定、无物理先验无测量方案。", "u": "../09_%E5%8F%AF%E8%A7%86%E5%8C%96%E6%80%BB%E8%A7%88/docs/08_%E7%89%A9%E7%90%86%E6%A8%A1%E5%9E%8B%E7%BB%BC%E8%BF%B0/07_%E5%A3%B0%E5%AD%A6%E4%B8%8E%E4%BF%A1%E5%8F%B7%E5%A4%84%E7%90%86.html"}, {"d": "声学与信号处理", "n": "阻尼、Q 值与谐振二阶节", "y": "", "scene": "谐振峰的宽度、衰减拖尾与滤波器设计（2025-A 的核心参数链）。", "eq": "二阶带通谐振器 $$H(s)=\\frac{\\omega_0 s}{s^2+(\\omega_0/Q)s+\\omega_0^2};\\qquad \\tan\\delta\\approx\\frac{1}{Q},\\qquad \\tau=\\frac{Q}{\\pi f}\\ (\\text{衰减时间}).$$ 竹材内摩擦 $\\tan\\delta\\approx0.05\\Rightarrow Q\\approx19$，对应 245 Hz 处衰减时间 ~25 ms（音符串音）；112 队统一取 $Q=8$（拖尾 ~10 ms）。", "pt": "① $Q$ 不是自由拟合参数，必须从材料损耗（$\\tan\\delta$）或实测峰宽推出；② 峰宽与衰减时间是同一参数的频域/时域两面，验证时两头都查。", "err": "$Q$ 值拍脑袋；忽略窄 Q 节的群时延在峰附近可达毫秒级，谐波去同步改变起音\"软硬\"。", "u": "../09_%E5%8F%AF%E8%A7%86%E5%8C%96%E6%80%BB%E8%A7%88/docs/08_%E7%89%A9%E7%90%86%E6%A8%A1%E5%9E%8B%E7%BB%BC%E8%BF%B0/07_%E5%A3%B0%E5%AD%A6%E4%B8%8E%E4%BF%A1%E5%8F%B7%E5%A4%84%E7%90%86.html"}, {"d": "声学与信号处理", "n": "拾音器物理与传感链", "y": "详见《06_电磁辐射与辐射防护》2.5", "scene": "", "eq": "", "pt": "磁拾音速度敏感（法拉第感应）把 $1/n^2$ 位移谱改写为 $1/n$       '<div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;cursor:pointer" data-flip="'+i+'">'+
      '<b style="font-family:var(--serif);font-size:15px;color:'+(done?'var(--acc)':'var(--ink)')+'">'+escHtml(c.n)+'</b>'+
      (c.y?'<span style="font-family:var(--mono);font-size:11px;color:var(--dim)">'+escHtml(c.y)+'</span>':'')+
      '<span style="margin-left:auto;font-size:11px;color:var(--dim)">'+escHtml(c.d)+' · 点击翻面</span></div>'+
      '<div data-back="'+i+'" hidden style="border-top:1px dashed var(--line);margin-top:8px;padding-top:8px;font-size:13px;line-height:2">'+
      (c.scene?'<p style="margin:2px 0"><b>适用</b>　'+escHtml(c.scene)+'</p>':'')+
      (c.eq?'<p style="margin:2px 0"><b>方程</b>　'+escHtml(c.eq)+'</p>':'')+
      (c.pt?'<p style="margin:2px 0"><b>要点</b>　'+escHtml(c.pt)+'</p>':'')+
      (c.err?'<p style="margin:2px 0;color:#8A3A2A"><b>易错</b>　'+escHtml(c.err)+'</p>':'')+
      '<div style="display:flex;gap:8px;margin-top:8px;align-items:center">'+
      '<button class="btn'+(done?'':' solid')+'" data-mark="'+i+'" type="button">'+(done?'再练':'掌握')+'</button>'+
      '<a class="btn" href="'+c.u+'" target="_blank" style="height:32px">综述原文 →</a></div></div></div>';
  });
  document.getElementById('fbox').innerHTML=html||'<div class="notebox">该筛选下没有卡片。</div>';
  document.getElementById('fcnt').textContent=n+' 张 · 已掌握 '+Object.keys(st).length+' / '+CARDS.length;
  katexRender(document.getElementById('fbox'));
}
function katexRender(el){
  if(window.renderMathInElement)renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}]});
}
document.getElementById('fbox').addEventListener('click',function(ev){
  var f=ev.target.closest('[data-flip]');
  if(f){var b=document.querySelector('[data-back="'+f.dataset.flip+'"]');
    if(b){b.hidden=!b.hidden;
      if(!b.hidden)katexRender(b);   // 首屏渲染时 KaTeX 可能尚未加载完，展开时补渲染
    }
    return;}
  var m=ev.target.closest('button[data-mark]');
  if(m){var st=fLoad(),c=CARDS[+m.dataset.mark];
    if(st[c.n])delete st[c.n];else st[c.n]=Date.now();
    fSave(st);render();}
});
render();
window.addEventListener('load',function(){render();});   // KaTeX defer 加载完毕后整体补渲染一次

</script>
</body>
</html>
